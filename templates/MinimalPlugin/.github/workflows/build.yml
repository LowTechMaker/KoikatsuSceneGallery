name: Verify plugin
on: [push, pull_request]
permissions:
  contents: read
  packages: read
jobs:
  verify:
    runs-on: windows-latest
    env:
      NuGetPackageSourceCredentials_SceneGalleryGitHub: "Username=${{ github.actor }};Password=${{ secrets.GITHUB_TOKEN }}"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - shell: pwsh
        run: ./eng/Verify-Plugin.ps1
