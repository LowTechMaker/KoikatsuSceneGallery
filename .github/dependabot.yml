version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 5
    groups:
      windows-app-runtime:
        patterns:
          - "Microsoft.WindowsAppSDK*"
          - "Microsoft.Windows.SDK.BuildTools*"
          - "Microsoft.Web.WebView2*"
          - "CommunityToolkit.WinUI*"
      nuget-dependencies:
        patterns:
          - "*"
        exclude-patterns:
          - "Microsoft.WindowsAppSDK*"
          - "Microsoft.Windows.SDK.BuildTools*"
          - "Microsoft.Web.WebView2*"
          - "CommunityToolkit.WinUI*"

  - package-ecosystem: "nuget"
    directory: "/PluginSdk"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 5
    groups:
      nuget-dependencies:
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Taipei"
    open-pull-requests-limit: 5
