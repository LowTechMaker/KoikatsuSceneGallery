name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout application
        uses: actions/checkout@v6
        with:
          path: KoikatsuSceneGallery

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "ga"

      - name: Determine version tag
        id: version
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Publish application x64
        shell: pwsh
        run: >
          dotnet publish KoikatsuSceneGallery/KoikatsuSceneGallery.csproj
          --configuration Release
          --runtime win-x64
          --output KoikatsuSceneGallery/artifacts/release/win-x64

      - name: Package zip
        shell: pwsh
        run: |
          $publishDir = "KoikatsuSceneGallery/artifacts/release/win-x64"
          Get-ChildItem "$publishDir" -Include "*.pdb" -Recurse | Remove-Item -Force -Confirm:$false
          Compress-Archive -Path "$publishDir\*" -DestinationPath "KoikatsuSceneGallery-${{ steps.version.outputs.tag }}-win-x64.zip"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: "*.zip"
