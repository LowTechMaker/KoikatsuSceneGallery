name: Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "ga"

      - name: Test Core
        run: dotnet test KoikatsuSceneGallery.Tests/KoikatsuSceneGallery.Tests.csproj -c Release --logger trx --results-directory artifacts/test-results/core

      - name: Save Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-linux-core
          path: artifacts/test-results/**/*.trx
          if-no-files-found: warn

  build:
    runs-on: windows-latest

    strategy:
      matrix:
        platform: [x64]
        configuration: [Release]

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: "ga"

      - name: Build
        run: dotnet build KoikatsuSceneGallery.csproj -c ${{ matrix.configuration }} -p:Platform=${{ matrix.platform }} -p:RuntimeIdentifier=win-${{ matrix.platform }}

      - name: Test
        run: dotnet test KoikatsuSceneGallery.Tests/KoikatsuSceneGallery.Tests.csproj -c ${{ matrix.configuration }} --logger trx --results-directory artifacts/test-results/core

      - name: Test Import Service Integration
        run: dotnet test KoikatsuSceneGallery.IntegrationTests/KoikatsuSceneGallery.IntegrationTests.csproj -c ${{ matrix.configuration }} -p:Platform=x64 -p:WindowsAppSDKSelfContained=true --logger trx --results-directory artifacts/test-results/integration

      - name: Save Test Results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-windows-${{ matrix.platform }}-${{ matrix.configuration }}
          path: artifacts/test-results/**/*.trx
          if-no-files-found: warn
